# coturn relay for UmbraChat calls, started by `docker compose --profile relay up -d`.
# Open UDP 3478 and min-port..max-port in the cloud security list AND the host firewall.
# Server env must match: TURN_URLS (turn: and stun: urls of this host) and TURN_SECRET.

listening-port=3478
min-port=49152
max-port=49252

# Credentials are minted by the UmbraChat server (TURN REST scheme), never static.
# static-auth-secret, realm and external-ip come from .env via compose.yaml.
use-auth-secret

fingerprint
no-cli
no-multicast-peers
no-tcp-relay

# Never relay into the VM's own network (SSRF into the private network).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

# Caps against bandwidth abuse on a free tier.
user-quota=4
total-quota=100
bps-capacity=0

# Logs contain client IPs, so both sinks are off. `no-stdout-log` alone is not enough: coturn then
# writes a dated file under /var/tmp. `simple-log` stops it from appending the date to the name,
# which is what lets `log-file=/dev/null` take effect.
no-stdout-log
simple-log
log-file=/dev/null
