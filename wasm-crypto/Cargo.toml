[package]
name = "wasm-crypto"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[lib]
crate-type = ["cdylib"]

[dependencies]
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.3", features = ["wasm_js"] }
# aes-gcm-siv (via libsignal-protocol) pulls in the older rand_core 0.6 line,
# which needs getrandom 0.2's wasm support too; unify by enabling it directly.
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
libsignal-protocol = { git = "https://github.com/signalapp/libsignal", tag = "v0.99.1", version = "0.1.0" }
rand = "0.9"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.126"
web-time = "1.1.0"
